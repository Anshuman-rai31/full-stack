<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <title>Document</title>
    <style>
        .card-container {
            display: flex;
            flex-wrap: wrap;
            padding: 20px;
            justify-content: space-between;
        }

        .card {
            display: flex;
            padding: 20px;
            border: 1px solid black;
            border-radius: 5px;
            box-shadow: 0 0 10px black;
            flex-direction: column;
            align-items: center;
            flex: 0 0 23%;
            margin-bottom: 30px;
            box-sizing: border-box;
        }

        .card img {
            width: 100%;
            max-width: 250px;
            height: 100px;
            border-radius: 8px;
            margin-bottom: 15px;
            object-fit: cover;
        }

        .buy-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 14px 28px;
            width: 100%;
            max-width: 320px;
            font-family: 'Inter', sans-serif;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            background-color: #10b981;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 4px 6px -1px rgba(16, 185, 129, 0.2), 0 2px 4px -1px rgba(16, 185, 129, 0.1);

        }
    </style>
</head>
