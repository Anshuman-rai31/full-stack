<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Catalogue</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #F8FAFC;
            color: #111827;
            font-size: 14px;
        }

        .container {
            max-width: 1440px;
            margin: 0 auto;
            padding: 30px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 700;
        }

        .mobile-btn {
            display: none;
            padding: 10px;
            background-color: #FFFFFF;
            border: 1px solid #E5E7EB;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .layout {
            display: flex;
            gap: 32px;
        }

        .sidebar {
            width: 240px;
        }

        .filter-box {
            background-color: #FFFFFF;
            border: 1px solid #E5E7EB;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .filter-box h3 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .filter-box ul {
            list-style: none;
        }

        .filter-box li {
            margin-bottom: 10px;
        }

        .filter-box label {
            display: flex;
            align-items: center;
            color: #6B7280;
            cursor: pointer;
        }

        .filter-box input {
            margin-right: 8px;
        }

        .products {
            width: 100%;
        }

        .grid {
            display: grid;
            gap: 24px;
            grid-template-columns: 1fr 1fr 1fr;
        }

        .card {
            background-color: #FFFFFF;
            border: 1px solid #E5E7EB;
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            width: 100%;
            position: relative;
        }

        .card:hover {
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .img-box {
            height: 220px;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 15px;
            position: relative;
            background-color: #E5E7EB;
        }

        .img-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: 0.3s;
        }

        .card:hover .img-box img {
            transform: scale(1.1);
        }



        .btn {
            background-color: #2563EB;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            width: 100%;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn:hover {
            background-color: #1d4ed8;
        }

        @media (max-width: 639px) {
            .layout {
                flex-direction: column;
            }

            .sidebar {
                display: none;
                width: 100%;
            }

            .grid {
                grid-template-columns: 1fr;
            }

            .mobile-btn {
                display: block;
            }
        }

        @media (min-width: 640px) and (max-width: 1023px) {
            .layout {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                display: flex;
                overflow-x: auto;
            }

            .filter-box {
                min-width: 200px;
                margin-right: 15px;
                margin-bottom: 0;
            }

            .grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        @media (min-width: 1280px) {
            .grid {
                grid-template-columns: 1fr 1fr 1fr 1fr;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="header">
            <h1>Our Products</h1>
            <button class="mobile-btn"
                onclick="var s = document.getElementById('sidebar'); if(s.style.display == 'block') { s.style.display = 'none'; } else { s.style.display = 'block'; }">
                Show Filters
            </button>
        </div>

        <div class="layout">

            <div class="sidebar" id="sidebar">

                <div class="filter-box">
                    <h3>Category</h3>
                    <ul>
                        <li><label><input type="checkbox" checked> Electronics</label></li>
                        <li><label><input type="checkbox"> Clothing</label></li>
                        <li><label><input type="checkbox"> Home & Garden</label></li>
                        <li><label><input type="checkbox"> Accessories</label></li>
                    </ul>
                </div>

                <div class="filter-box">
                    <h3>Brand</h3>
                    <ul>
                        <li><label><input type="checkbox"> Apple</label></li>
                        <li><label><input type="checkbox"> Samsung</label></li>
                        <li><label><input type="checkbox"> Sony</label></li>
                    </ul>
                </div>

                <div class="filter-box">
                    <h3>Price Range</h3>
                    <ul>
                        <li><label><input type="checkbox"> Under $50</label></li>
                        <li><label><input type="checkbox"> $50 - $100</label></li>
                        <li><label><input type="checkbox"> Over $100</label></li>
                    </ul>
                </div>

            </div>

            <div class="products">
                <div class="grid">

                    <div class="card">
                        <div class="img-box">
                            <div class="new-badge">NEW</div>
                        </div>
                        <div class="category">Electronics</div>
                        <div class="title">Apple Watch Series 8</div>
                        <button class="btn">Add to Cart</button>
                    </div>

                    <div class="card">
                        <div class="img-box">
                        </div>
                        <div class="category">Audio</div>
                        <div class="title">Wireless Headphones</div>
                        <button class="btn">Add to Cart</button>
                    </div>

                    <div class="card">
                        <div class="img-box">
                        </div>
                        <div class="category">Photography</div>
                        <div class="title">Vintage Camera</div>
                        <button class="btn">Add to Cart</button>
                    </div>

                    <div class="card">
                        <div class="img-box">
                        </div>
                        <div class="category">Accessories</div>
                        <div class="title">Urban Backpack</div>
                        <button class="btn">Add to Cart</button>
                    </div>

                    <div class="card">
                        <div class="img-box">
                        </div>
                        <div class="category">Gaming</div>
                        <div class="title">Mechanical Keyboard</div>
                        <button class="btn">Add to Cart</button>
                    </div>

                    <div class="card">
                        <div class="img-box">
                            <div class="new-badge">NEW</div>
                        </div>
                        <div class="category">Computers</div>
                        <div class="title">Creator Laptop</div>
                        <button class="btn">Add to Cart</button>
                    </div>

                </div>
            </div>

        </div>
    </div>

</body>

</html>
