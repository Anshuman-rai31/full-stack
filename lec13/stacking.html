<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        :root {
            --primary-color: #dedede;
            --padding: 10px;
            --font-size: 30px;
        }

        .container {
            background-color: var(--primary-color);
            height: 500px;
            width: 500px;
            display: grid;
            outline: 1px solid black;
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: 1fr 1fr 1fr;
        }

        .container>div {
            padding: var(--padding);
            font-size: calc(var(--font-size)*2);
            outline: 1px dashed black;
        }

        /* #box1{
        background-color: white;
        grid-column-start: 1;
        grid-column-end: 3;
        grid-row-start: 1;
        grid-row-end: 3;
        z-index:1;
    }
    #box6{
        background-color: gray;
        grid-column-start: 2;
        grid-column-end: 3;
        grid-row-start: 2;
        grid-row-end: 3;
        z-index: 2;
    } */
        .parent {
            display: grid;
            background-color: blue;
            grid-template-columns: subgrid;
            grid-template-rows: subgrid;
            grid-column: 1/3;
            grid-row: 1/3;
            /* grid-template-columns: subgrid; */
            /* grid-template-rows: subgrid; */

        }

        .child {
            background-color: black;
            color: white;
            grid-column: 2/3;
            grid-row: 2/3;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="parent">
            <div class="child">1</div>
        </div>
    </div>
</body>

</html>
