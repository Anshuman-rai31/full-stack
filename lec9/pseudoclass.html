<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        input {
            font-size: 20px;
            border-width: 0px 0px 3px 0px;
            border-color: #333;
            padding: 8px;
            outline: none;
        }

        input:required {
            border-color: #ff6f61;
        }

        input:optional {
            border-color: #009688;
        }

        input:disabled {
            border-color: #3f51b5;
            background-color: #9e9e9e;
            color: white;
        }

        input:read-only {
            background-color: #4caf50;
            color: white;
        }

        input:read-write {
            background-color: #e0f7fa;
        }

        input:valid {
            background-color: #ffe0b2;
        }

        input:invalid {
            background-color: #fce4ec;
        }

        input:not(:required) {
            background-color: #fff59d;
        }

        input:in-range {
            background-color: #a5d6a7;
        }

        form {
            background-color: #f5f5f5;
            padding: 20px;
            border-radius: 10px;
            width: 300px;
            margin: auto;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2);
        }

        input[type="submit"] {
            background-color: #009688;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
        }

        input[type="submit"]:hover {
            background-color: #00796b;
        }

        div:has(h1) {
            background-color: #333;
            color: white;
        }

        div:not(:has(h1)) {
            background-color: #4caf50;
        }

        input:placeholder-shown {
            color: #00796b;
        }
    </style>
</head>

<body>

    <form>
        <input type="text" placeholder="First Name" required><br /><br />
        <input type="text" placeholder="Middle Name"><br /><br />
        <input type="text" placeholder="Last Name" required><br /><br />
        <input type="text" value="Mathura" disabled><br /><br />
        <input type="number" min="100" max="200" required><br /><br />

        <input type="submit" value="Submit">
    </form>

    <div>
        <h1>Heading 1</h1>
    </div>
    <div>
        <h1>Heading 2</h1>
    </div>

</body>

</html>
