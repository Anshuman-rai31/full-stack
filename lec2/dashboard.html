<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard</title>
    <link rel="stylesheet" href="dashboard.css" />
</head>

<body>  
    <div class="app">
        <aside class="sidebar">
            <div class="brand">sidebar</div>
            <nav>
                <a class="active" href="#">Overview</a>
                <a href="#">Reports</a>
                <a href="#">Projects</a>
                <a href="#">Messages</a>
                <a href="#">Settings</a>
            </nav>
        </aside>

        <div class="main">
            <header class="topbar">
                <div>

                    <h1>Dashboard Overview</h1>
                </div>
            </header>

            <div class="stats-grid">
                <div class="stat-card">
                    <div class="label">Revenue</div>
                    <div class="value">$24.8K</div>

                </div>
                <div class="stat-card">
                    <div class="label">Users</div>
                    <div class="value">1,280</div>
                </div>
                <div class="stat-card">
                    <div class="label">Orders</div>
                    <div class="value">312</div>

                  </div>
                <div class="stat-card">
                    <div class="label">Satisfaction</div>
                    <div class="value">94%</div>

                </div>
            </div>


        </div>
    </div>
</body>

</html>
