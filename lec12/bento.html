<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin: 0;
            padding: 0;
        }

        .bento-grid {
            display: grid;
            outline: 2px solid black;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            /* grid-template-rows: repeat(auto-fill, minmax(150px, 1fr)); */
            grid-template-areas:
                "box1 box1 box2"
                "box1 box1 box7"
                "box3 box4 box7"
                "box3 box6 box7"
                "box5 box6 box7";
            width: 100vw;
            height: 100vh;
            box-sizing: border-box;
            justify-content: center;
            margin: 0;
        }

        .bento-grid>div {
            font-size: 30px;
            outline: 1px solid black;
            border-radius: 30px;
            margin: 5px;
        }

        #box1 {
            background-color: aliceblue;
            grid-column-start: 1;
            grid-column-end: 3;
            grid-row-start: 1;
            grid-row-end: 3;
            z-index: 1;
        }

        #box2 {
            background-color: rgb(135, 133, 210);
            grid-column-start: 3;
            grid-column-end: 4;
            grid-row-start: 1;
            grid-row-end: 2;
            z-index: 2;
        }

        #box3 {
            background-color: rgb(239, 250, 194);
            grid-column-start: 1;
            grid-column-end: 2;
            grid-row-start: 3;
            grid-row-end: 4;
            z-index: 3;
        }

        #box4 {
            background-color: rgb(248, 195, 182);
            grid-column-start: 2;
            grid-column-end: 3;
            grid-row-start: 3;
            grid-row-end: 4;
            z-index: 4;
        }

        #box5 {
            background-color: rgb(160, 225, 255);
            grid-column-start: 1;
            grid-column-end: 2;
            grid-row-start: 5;
            grid-row-end: 6;
            z-index: 5;
        }

        #box6 {
            background-color: rgb(249, 249, 187);
            grid-column-start: 2;
            grid-column-end: 3;
            grid-row-start: 5;
            grid-row-end: 6;
            z-index: 6;
        }

        #box7 {
            background-color: rgb(173, 185, 255);
            grid-column-start: 3;
            grid-column-end: 4;
            grid-row-start: 3;
            grid-row-end: 7;
            z-index: 7;
        }
    </style>
</head>

<body>
    <div class="bento-grid">
        <div style="grid-area: box1;" id="box1">
            <h2>1</h2>
        </div>
        <div style="grid-area: box2;" id="box2">
            <h2>2</h2>
        </div>
        <div style="grid-area: box3;" id="box3">
            <h2>3</h2>

        </div>
        <div style="grid-area: box4;" id="box4">
            <h2>4</h2>
        </div>
        <div style="grid-area: box5;" id="box5">
            <h2>5</h2>
        </div>
        <div style="grid-area: box6;" id="box6">
            <h2>6</h2>
        </div>
        <div style="grid-area: box7;">
            <h2>7</h2>
        </div>
    </div>
</body>

</html>
