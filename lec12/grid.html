<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            display: grid;
            /* grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); */
            /* grid-template-rows: repeat(2, 1fr); */

            outline: 1px solid black;
            grid-template-areas:
                "box1 box1 box2"
                "box1 box1 box3"
                "box4 box5 box6";
        }

        .container>div {
            font-size: 30px;
            outline: 1px dashed black;
        }
    </style>
</head>

<body>
    <div class="container">
        <div>1</div>
        <div>2</div>
        <div>3</div>
        <div>4</div>
        <div>5</div>
    </div>
</body>

</html>
