<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        html,
        body {
            background-color: black;
            background-image: url('wp2713730-batman-wallpapers-1080p.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            margin: 0;
            padding: 0;
            scroll-behavior: smooth;
            overflow-y: hidden;
        }

        .container {
            display: flex;
            width: max-content;
        }

        h1 {
            color: white;
            text-align: center;
            font-family: sans-serif;
            font-size: 4rem;
            text-transform: uppercase;
            letter-spacing: 8px;
            text-shadow: 3px 3px 8px rgba(0, 0, 0, 0.8);
        }

        .box {
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
            position: sticky;
            left: 0;
        }


        .box img {
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.9), 0 0 15px rgba(255, 255, 255, 0.15);
            object-fit: cover;
            transition: transform 0.4s ease, box-shadow 0.4s ease;
        }

        .box img:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 1), 0 0 25px rgba(255, 255, 255, 0.25);
        }

        #box1 {
            position: relative;
        }

        #box2 {
            /*background-color: rgba(81, 11, 11, 0.65);*/
        }

        #box3 {
            /*background-color: rgba(106, 92, 21, 0.65);*/
        }

        #box3 img {
            object-position: top center;
        }

        #box4 {
            /*background-color: rgba(150, 76, 33, 0.65);*/
        }

        .quote {
            position: absolute;
            color: white;
            font-size: 2.5rem;
            font-family: sans-serif;
            font-weight: bold;
            font-style: italic;
            text-transform: uppercase;
            letter-spacing: 4px;
            text-shadow: 4px 4px 10px rgba(0, 0, 0, 1);
            bottom: 15%;
            text-align: center;
            width: 100%;
            pointer-events: none;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="box" id="box1">
            <h1>The Dark Knight</h1>
        </div>

        <div class="box" id="box2">
            <img src="batman-is-not-a-replacement-he-is-a-revolution-4i-1336x768.jpg" alt="Batman Begins" width="500px"
                height="500px">
            <div class="quote">"I'm vengeance."</div>
        </div>
        <div class="box" id="box3">
            <img src="joker.jpg" alt="Batman Begins" width="500px" height="500px">
        </div>
        <div class="box" id="box4">
            <img src="the-penguin-ascendant-9l-1336x768.jpg" alt="Batman Begins" width="500px" height="500px">
        </div>
        <div class="box" id="box5">
            <img src="wallpaperflare.com_wallpaper.jpg" alt="Batman Begins" width="500px" height="500px">
        </div>
        <div class="box" id="box6">
            <img src="Bane.jpg" alt="Batman Begins" width="500px" height="500px">
        </div>
    </div>
</body>

</html>
