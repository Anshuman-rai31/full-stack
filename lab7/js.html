    <script>
        // var x = "Hello World";

        // var a = fun;
        // console.log(a());

        //var (oldest),const,let (scoped)

        /*Hoisting*/

        // let a = 5;

        //Temporal Dead Zone
        // console.log(n);
        // n = 5;
        const x = {
            "key": "value",
            "key2": {
                "key3": "value3"
            }
        }

        console.log(typeof x);

        // --- Conditional Statements Examples ---

        // 1. if Statement
        let age = 20;
        if (age >= 18) {
            console.log("You are eligible to vote.");
        }

        // 2. else Statement
        let time = 20;
        if (time < 18) {
            console.log("Good day.");
        } else {
            console.log("Good evening.");
        }

        // 3. else if Statement
        let score = 85;
        if (score >= 90) {
            console.log("Grade: A");
        } else if (score >= 80) {
            console.log("Grade: B");
        } else if (score >= 70) {
            console.log("Grade: C");
        } else {
            console.log("Grade: F");
        }

        // 4. switch Statement
        let dayOfWeek = 3;
        let dayName;
        switch (dayOfWeek) {
            case 1: dayName = "Monday"; break;
            case 2: dayName = "Tuesday"; break;
            case 3: dayName = "Wednesday"; break;
            case 4: dayName = "Thursday"; break;
            case 5: dayName = "Friday"; break;
            case 6: dayName = "Saturday"; break;
            case 7: dayName = "Sunday"; break;
            default: dayName = "Invalid day";
        }
        console.log("Today is " + dayName);

        // --- Try...Catch Example ---
        try {
            // Code that might throw an error
            let nonExistentVariable = someUndefinedFunction();
            console.log("This line will not execute");
        } catch (error) {
            // Code to handle the error
            console.error("An error occurred: " + error.message);
        } finally {
            // Code that always executes, regardless of an error
            console.log("The try...catch block is finished.");
        }

        // 5. Ternary Operator (Conditional Operator)
        let isMember = true;
        let discount = (isMember) ? "10%" : "0%";
        console.log("Your discount is: " + discount);

    </script>
</body>
