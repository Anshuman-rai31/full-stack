<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whack A Mole</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 30px;
            background-color: #f4f4f4;
        }

        h1 {
            color: #333;
        }

        #start-btn {
            font-size: 18px;
            padding: 10px 20px;
            margin: 10px;
            cursor: pointer;
            border-radius: 8px;
            border: none;
            background-color: #4caf50;
            color: white;
            font-weight: bold;
        }

        #start-btn:hover {
            background-color: #45a049;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 110px);
            grid-gap: 12px;
            justify-content: center;
            margin: 20px auto;
        }

        .grid button {
            width: 110px;
            height: 110px;
            font-size: 18px;
            cursor: pointer;
            border-radius: 12px;
            border: 2px solid #888;
            background-color: #fff;
            transition: 0.1s;
        }

        .grid button:hover {
            background-color: #eee;
        }

        #message {
            font-size: 20px;
            font-weight: bold;
            margin-top: 15px;
            color: #333;
        }
    </style>
</head>

<body>
    <h1>Whack A Mole</h1>
    <button id="start-btn" onclick="start()">Start</button>

    <h3 id="score">Score: 0</h3>
    <h3 id="timer">Time Left: 30s</h3>

    <div class="grid">
        <button id="hole0" onclick="whack(0)">Hole 0</button>
        <button id="hole1" onclick="whack(1)">Hole 1</button>
        <button id="hole2" onclick="whack(2)">Hole 2</button>
        <button id="hole3" onclick="whack(3)">Hole 3</button>
        <button id="hole4" onclick="whack(4)">Hole 4</button>
        <button id="hole5" onclick="whack(5)">Hole 5</button>
        <button id="hole6" onclick="whack(6)">Hole 6</button>
        <button id="hole7" onclick="whack(7)">Hole 7</button>
        <button id="hole8" onclick="whack(8)">Hole 8</button>
    </div>

    <p id="message"></p>

    <script src="whackamole.js"></script>
</body>

</html>
